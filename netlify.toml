[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: send every path to index.html so React Router can handle it.
# Without this, refreshing /hotels or /confirmation/HS-XXXX shows a Netlify 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
